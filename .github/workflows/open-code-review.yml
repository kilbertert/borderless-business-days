name: OpenCodeReview (manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-code-review-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (
          startsWith(github.event.comment.body, '/open-code-review') ||
          startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Resolve pull request
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: ${process.env.PR_NUMBER}`);
              return;
            }

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            core.setOutput('base_ref', pullRequest.base.ref);
            core.setOutput('head_sha', pullRequest.head.sha);
            core.setOutput('title', pullRequest.title);

      - name: Run OpenCodeReview
        id: ocr
        continue-on-error: true
        uses: alibaba/open-code-review@e670b3b3f6b56ef63f4222148696e315268a26e2 # v1.8.0
        with:
          llm_url: https://rainyun-g74a8dea.tail5df4d7.ts.net:10000/v1/chat/completions
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: gpt-5.6-sol
          llm_use_anthropic: 'false'
          llm_extra_body: '{"max_completion_tokens":8192}'
          language: 中文
          base_ref: ${{ steps.pr.outputs.base_ref }}
          head_sha: ${{ steps.pr.outputs.head_sha }}
          background: ${{ steps.pr.outputs.title }}
          ocr_version: 1.8.0
          review_concurrency: '1'
          sticky_summary: 'true'
          incremental: 'true'
          upload_artifacts: 'false'

      - name: Upload OCR session diagnostics
        if: always() && steps.ocr.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ocr-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/.opencodereview/sessions
          if-no-files-found: warn
          retention-days: 3

      - name: Summarize advisory review
        if: always()
        shell: bash
        env:
          OCR_OUTCOME: ${{ steps.ocr.outcome }}
        run: |
          {
            echo '## OpenCodeReview advisory result'
            echo
            echo "Action outcome: $OCR_OUTCOME"
            if [[ -s /tmp/ocr-result.json ]]; then
              echo
              jq -r '
                "Status: \(.status // "unknown")\n" +
                "Comments: \(.summary.comments // 0)\n" +
                "Critical/high: \([.comments[]? | select(.severity == "critical" or .severity == "high")] | length)"
              ' /tmp/ocr-result.json
            else
              echo 'No structured result was produced.'
            fi
            echo
            echo 'This review is advisory and requires human triage.'
          } >>"$GITHUB_STEP_SUMMARY"
